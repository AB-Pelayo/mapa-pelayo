<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa Semilla 25/26 | Pelayo Agronomía</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

<style>
html, body {
height:100%;
margin:0;
padding:0;
}

#map{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
}

.control{
background:white;
padding:8px;
font-size:12px;
max-height:80vh;
overflow:auto;
box-shadow:0 0 6px rgba(0,0,0,0.3);
border-radius:6px;
}

#logoPelayo{
position:absolute;
bottom:10px;
left:10px;
z-index:1000;
}

#logoPelayo img{
height:35px;
background:white;
padding:4px;
border-radius:6px;
box-shadow:0 2px 6px rgba(0,0,0,0.25);
}

#searchBox{
position:absolute;
bottom:25px;
left:180px;
z-index:1000;
background:white;
padding:6px 12px;
border-radius:8px;
font-size:14px;
box-shadow:0 2px 6px rgba(0,0,0,0.3);
}

#modoPresentacion{
position:absolute;
top:10px;
left:60px;
z-index:1000;
}

#coordsMouse{
position:absolute;
bottom:10px;
right:10px;
background:white;
padding:6px 10px;
border-radius:6px;
font-size:13px;
box-shadow:0 2px 6px rgba(0,0,0,0.3);
z-index:1000;
}

#btnPresentacion{
background:white;
border:none;
padding:6px 10px;
border-radius:6px;
box-shadow:0 2px 6px rgba(0,0,0,0.3);
font-size:13px;
cursor:pointer;
}

.legend{
background:white;
padding:8px;
border-radius:6px;
box-shadow:0 0 6px rgba(0,0,0,0.3);
}

.legend i{
width:18px;
height:18px;
float:left;
margin-right:8px;
opacity:0.8;
}

.var-color{
display:inline-block;
width:12px;
height:12px;
margin-right:6px;
}

#contadorLotes{
position:absolute;
bottom:65px;
left:10px;
background:white;
padding:6px 10px;
border-radius:8px;
font-size:14px;
z-index:1000;
box-shadow:0 2px 6px rgba(0,0,0,0.3);
}
</style>

</head>

<body>

<div id="map"></div>

<div id="coordsMouse">Lat: -- | Lon: --</div>

<script>

const map = L.map('map').setView([-37.3,-59.1],7);

map.on("mousemove", function(e){

document.getElementById("coordsMouse").innerHTML =
"Lat: " + e.latlng.lat.toFixed(5) +
" | Lon: " + e.latlng.lng.toFixed(5);

});

/* BOTON GPS */

const gpsControl=L.control({position:"topleft"});

gpsControl.onAdd=function(){
const div=L.DomUtil.create("div","control");
div.innerHTML='<button id="gpsBtn">📍 GPS</button>';
return div;
};

gpsControl.addTo(map);

const mapa=L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{attribution:"© OpenStreetMap"}
);

const satelite=L.tileLayer(
"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
{attribution:"© Esri"}
);

mapa.addTo(map);

L.control.layers({
"Mapa":mapa,
"Satélite":satelite
}).addTo(map);

/* GPS CORREGIDO */

let gpsMarker=null;
let gpsAccuracyCircle=null;
let gpsWatching=false;

document.addEventListener("click",function(e){

if(e.target && e.target.id==="gpsBtn"){

const btn=document.getElementById("gpsBtn");

if(!gpsWatching){

map.locate({
watch:true,
setView:true,
maxZoom:16,
enableHighAccuracy:true,
maximumAge:0,
timeout:10000
});

gpsWatching=true;
btn.innerText="📍 GPS (activo)";

}else{

map.stopLocate();
gpsWatching=false;
btn.innerText="📍 GPS";

if(gpsMarker){map.removeLayer(gpsMarker);gpsMarker=null;}
if(gpsAccuracyCircle){map.removeLayer(gpsAccuracyCircle);gpsAccuracyCircle=null;}

}

}

});

map.on("locationfound",function(e){

if(gpsMarker){
gpsMarker.setLatLng(e.latlng);
}else{
gpsMarker=L.circleMarker(e.latlng,{
radius:8,
color:"blue",
fillColor:"blue",
fillOpacity:0.9
}).addTo(map);
}

if(gpsAccuracyCircle){
gpsAccuracyCircle.setLatLng(e.latlng).setRadius(e.accuracy);
}else{
gpsAccuracyCircle=L.circle(e.latlng,{
radius:e.accuracy,
color:"#3f92ff",
weight:1,
fillOpacity:0.05
}).addTo(map);
}

});

map.on("locationerror",function(){
alert("No se pudo obtener tu ubicación");
gpsWatching=false;
const btn=document.getElementById("gpsBtn");
if(btn){btn.innerText="📍 GPS";}
if(gpsMarker){map.removeLayer(gpsMarker);gpsMarker=null;}
if(gpsAccuracyCircle){map.removeLayer(gpsAccuracyCircle);gpsAccuracyCircle=null;}
});

</script>

</body>
</html>
