<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa Semilla 25/26 | Pelayo Agronomía</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

<style>
html, body {
height:100%;
margin:0;
padding:0;
}

#map{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
}

.control{
background:white;
padding:8px;
font-size:12px;
max-height:80vh;
overflow:auto;
box-shadow:0 0 6px rgba(0,0,0,0.3);
border-radius:6px;
}

#logoPelayo{
position:absolute;
bottom:10px;
left:10px;
z-index:1000;
}

#logoPelayo img{
height:35px;
background:white;
padding:4px;
border-radius:6px;
box-shadow:0 2px 6px rgba(0,0,0,0.25);
}

#searchBox{
position:absolute;
bottom:25px;
left:180px;
z-index:1000;
background:white;
padding:6px 12px;
border-radius:8px;
font-size:14px;
box-shadow:0 2px 6px rgba(0,0,0,0.3);
}

#modoPresentacion{
position:absolute;
top:10px;
left:60px;
z-index:1000;
}

#coordsMouse{
position:absolute;
bottom:10px;
right:10px;
background:white;
padding:6px 10px;
border-radius:6px;
font-size:13px;
box-shadow:0 2px 6px rgba(0,0,0,0.3);
z-index:1000;
}

#contadorLotes{
position:absolute;
bottom:65px;
left:10px;
background:white;
padding:6px 10px;
border-radius:8px;
font-size:14px;
z-index:1000;
box-shadow:0 2px 6px rgba(0,0,0,0.3);
}

/* LOGIN */

#loginScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
display:flex;
justify-content:center;
align-items:center;
z-index:99999;
}

#loginBox{
background:white;
padding:40px;
border-radius:10px;
text-align:center;
width:380px;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
<div id="loginBox">

<img src="logo.pelayo.fin.png" style="width:140px;margin-bottom:20px;">
<h2>Mapa Producción de Semilla</h2>

<input type="password" id="password" placeholder="Ingrese contraseña">
<button onclick="checkLogin()">Entrar</button>
<p id="loginError"></p>

</div>
</div>

<div id="map"></div>

<div id="contadorLotes">Lotes: 0 | Ha: 0</div>

<div id="coordsMouse">Lat: - | Lon: -</div>

<div id="logoPelayo">
<img src="logo.pelayo.fin.png">
</div>

<div id="searchBox">
<input id="campoSearch" placeholder="Buscar campo..." style="border:none;outline:none;width:200px;">
</div>

<div id="modoPresentacion">
<button id="btnPresentacion">🖥️ Presentación</button>
</div>

<script>

/* MEMORIA */

let lotesCosechados =
JSON.parse(localStorage.getItem("lotesCosechados")) || {};

let capaCosecha={};

/* ... RESTO DEL ARCHIVO ORIGINAL intacto ... */

/* FUNCIONES NUEVAS */

function marcarCosechado(id){

lotesCosechados[id]=true;

localStorage.setItem(
"lotesCosechados",
JSON.stringify(lotesCosechados)
);

}

function desmarcarCosechado(id){

delete lotesCosechados[id];

localStorage.setItem(
"lotesCosechados",
JSON.stringify(lotesCosechados)
);

}

</script>

</body>
</html>
