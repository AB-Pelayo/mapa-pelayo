<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa Semilla 25/26 | Pelayo Agronomía</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

<style>
html, body {
height:100%;
margin:0;
padding:0;
}

#map{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
}

.control{
background:white;
padding:8px;
font-size:12px;
max-height:80vh;
overflow:auto;
box-shadow:0 0 6px rgba(0,0,0,0.3);
border-radius:6px;
}

#logoPelayo{
position:absolute;
bottom:10px;
left:10px;
z-index:1000;
}

#logoPelayo img{
height:35px;
background:white;
padding:4px;
border-radius:6px;
box-shadow:0 2px 6px rgba(0,0,0,0.25);
}

#searchBox{
position:absolute;
bottom:25px;
left:180px;
z-index:1000;
background:white;
padding:6px 12px;
border-radius:8px;
font-size:14px;
box-shadow:0 2px 6px rgba(0,0,0,0.3);
}

#modoPresentacion{
position:absolute;
top:10px;
left:60px;
z-index:1000;
}

#coordsMouse{
position:absolute;
bottom:10px;
right:10px;
background:white;
padding:6px 10px;
border-radius:6px;
font-size:13px;
box-shadow:0 2px 6px rgba(0,0,0,0.3);
z-index:1000;
}

.cosechado-tooltip {
background: transparent;
border: none;
font-size: 14px;
font-weight: bold;
color: black;
}
</style>
</head>

<body>

<div id="loginScreen">
<div id="loginBox">

<img src="logo.pelayo.fin.png" style="width:140px;margin-bottom:20px;">
<h2>Mapa Producción de Semilla</h2>

<input type="password" id="password">
<button onclick="checkLogin()">Entrar</button>
<p id="loginError"></p>

</div>
</div>

<div id="map"></div>

<div id="contadorLotes">Lotes: 0 | Ha: 0</div>
<div id="coordsMouse">Lat: - | Lon: -</div>

<script>

const map=L.map("map").setView([-35.3,-63.2],7);

let geoLayer;

/* 🔵 GUARDADO */

let lotesCosechados =
JSON.parse(localStorage.getItem("lotesCosechados")) || {};

/* ZOOM CONTROL ✓ */

map.on("zoomend",function(){

if(!geoLayer) return;

geoLayer.eachLayer(function(layer){

const name =
layer.feature.properties.Name;

if(lotesCosechados[name]){

if(map.getZoom() >= 12){

layer.bindTooltip("✓",{
permanent:true,
direction:"center",
className:"cosechado-tooltip"
});

}else{

layer.unbindTooltip();

}

}

});

});

/* CONTADOR */

function actualizarContador(){

let count=0;
let totalHa=0;

geoLayer.eachLayer(function(layer){

count++;

try{
const ha=turf.area(layer.feature)/10000;
totalHa+=ha;
}catch{}

});

document.getElementById("contadorLotes").innerText=
"Lotes: "+count+" | Ha: "+totalHa.toFixed(0);

}

/* CARGA LOTES */

fetch("lotes.geojson")
.then(r=>r.json())
.then(data=>{

function colorVariedad(v){

const colores={
"DM38E26":"#e41a1c",
"DM40R26":"#377eb8",
"DM40E25":"#4daf4a",
"DM46R25":"#984ea3",
"DM46E25":"#ff7f00",
"DM47E23":"#ffff33",
"DM49R26":"#a65628",
"DM50E25":"#f781bf"
};

return colores[v]||"#999";
}

function getVariedad(n){
const m=n.toUpperCase().match(/DM\d+[ER]\d+/);
return m?m[0]:"SIN";
}

geoLayer=L.geoJSON(data,{

style:f=>{

const v=getVariedad(
f.properties.Name||""
);

return{
color:"#333",
weight:1,
fillOpacity:0.8,
fillColor:colorVariedad(v)
};

},

onEachFeature:(f,l)=>{

const name=f.properties.Name;

try{

const ha=turf.area(f)/10000;

const botones=

`<br>
<button onclick="marcarCosechado('${name}')">
🌾 Marcar cosechado
</button>

<button onclick="desmarcarCosechado('${name}')">
❌ Desmarcar
</button>
`;

l.bindPopup(
"<b>"+name+"</b><br>"+
ha.toFixed(1)+" ha"+
botones
);

}catch{

l.bindPopup(name);

}

/* SI YA ESTABA */

if(lotesCosechados[name]){

if(map.getZoom()>=12){

l.bindTooltip("✓",{
permanent:true,
direction:"center",
className:"cosechado-tooltip"
});

}

}

}

}).addTo(map);

actualizarContador();

});

/* MARCAR */

function marcarCosechado(id){

lotesCosechados[id]=true;

localStorage.setItem(
"lotesCosechados",
JSON.stringify(lotesCosechados)
);

map.fire("zoomend");

}

/* DESMARCAR */

function desmarcarCosechado(id){

delete lotesCosechados[id];

localStorage.setItem(
"lotesCosechados",
JSON.stringify(lotesCosechados)
);

map.fire("zoomend");

}

/* LOGIN */

function checkLogin(){

var pass=document.getElementById("password").value;

if(pass==="pelayo2526"){

document.getElementById("loginScreen").style.display="none";

}else{

document.getElementById("loginError").innerHTML="Contraseña incorrecta";

}

}

document.getElementById("password").addEventListener("keydown",function(e){

if(e.key==="Enter"){

checkLogin();

}

});

</script>

</body>
</html>
