<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa Semilla 25/26 | Pelayo Agronomía</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

<style>
html, body {
height:100%;
margin:0;
padding:0;
}

#map{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
}

.control{
background:white;
padding:8px;
font-size:12px;
max-height:80vh;
overflow:auto;
box-shadow:0 0 6px rgba(0,0,0,0.3);
border-radius:6px;
}

#logoPelayo{
position:absolute;
bottom:10px;
left:10px;
z-index:1000;
}

#logoPelayo img{
height:35px;
background:white;
padding:4px;
border-radius:6px;
box-shadow:0 2px 6px rgba(0,0,0,0.25);
}

#searchBox{
position:absolute;
bottom:25px;
left:180px;
z-index:1000;
background:white;
padding:6px 12px;
border-radius:8px;
font-size:14px;
box-shadow:0 2px 6px rgba(0,0,0,0.3);
}

#modoPresentacion{
position:absolute;
top:10px;
left:60px;
z-index:1000;
}

#coordsMouse{
position:absolute;
bottom:10px;
right:10px;
background:white;
padding:6px 10px;
border-radius:6px;
font-size:13px;
box-shadow:0 2px 6px rgba(0,0,0,0.3);
z-index:1000;
}

.cosecha-icon{
font-size:18px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
<div id="loginBox">

<img src="logo.pelayo.fin.png" style="width:140px;margin-bottom:20px;">
<h2>Mapa Producción de Semilla</h2>

<input type="password" id="password">
<button onclick="checkLogin()">Entrar</button>
<p id="loginError"></p>

</div>
</div>

<div id="map"></div>

<div id="contadorLotes">Lotes: 0 | Ha: 0</div>

<div id="coordsMouse">Lat: - | Lon: -</div>

<script>

const map=L.map("map").setView([-35.3,-63.2],7);

setTimeout(function(){
map.invalidateSize();
},200);

/* MEMORIA COSECHA */

let lotesCosechados =
JSON.parse(localStorage.getItem("lotesCosechados")) || {};

let iconosCosecha={};

/* ZOOM CONTROL */

map.on("zoomend",function(){

Object.keys(iconosCosecha).forEach(function(id){

if(map.getZoom()>=12){

iconosCosecha[id].addTo(map);

}else{

map.removeLayer(iconosCosecha[id]);

}

});

});

/* FUNCIONES COSECHA */

function marcarCosechado(id){

lotesCosechados[id]=true;

localStorage.setItem(
"lotesCosechados",
JSON.stringify(lotesCosechados)
);

map.fire("zoomend");

}

function desmarcarCosechado(id){

delete lotesCosechados[id];

localStorage.setItem(
"lotesCosechados",
JSON.stringify(lotesCosechados)
);

if(iconosCosecha[id]){

map.removeLayer(iconosCosecha[id]);

delete iconosCosecha[id];

}

}

/* LOGIN */

function checkLogin(){

var pass=document.getElementById("password").value;

if(pass==="pelayo2526"){

document.getElementById("loginScreen").style.display="none";

}else{

document.getElementById("loginError").innerHTML="Contraseña incorrecta";

}

}

document.getElementById("password")
.addEventListener("keydown",function(e){

if(e.key==="Enter"){
checkLogin();
}

});

</script>

</body>
</html>
